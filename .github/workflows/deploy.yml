name: Deploy

on:
  workflow_dispatch:
    inputs:
      event:
        description: Event
        required: true
        type: choice
        default: pgc
        options:
          - pgc
          - pygc

jobs:
  deploy-pgc-prod:
    if: ${{ inputs.event == 'pgc' }}
    runs-on: ubuntu-latest
    environment: pgc
    env:
      EVENT: pgc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.PGC_FTP_HOST }}
          username: ${{ secrets.PGC_FTP_USER }}
          password: ${{ secrets.PGC_FTP_PASS }}
          local-dir: ./out/
          server-dir: ${{ vars.PGC_FTP_PATH }}
  deploy-pygc-prod:
    if: ${{ inputs.event == 'pygc' }}
    runs-on: ubuntu-latest
    environment: pygc
    env:
      EVENT: pygc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.PYGC_FTP_HOST }}
          username: ${{ secrets.PYGC_FTP_USER }}
          password: ${{ secrets.PYGC_FTP_PASS }}
          local-dir: ./out/
          server-dir: ${{ vars.PYGC_FTP_PATH }}
