name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      event:
        description: Event
        required: true
        type: choice
        default: pgc
        options:
          - pgc
          - pygc
          - honte

env:
  VERSION: ${{ github.sha }}

jobs:
  deploy-pgc-prod:
    if: ${{ github.event_name == 'push' || inputs.event == 'pgc' }}
    runs-on: ubuntu-latest
    environment: pgc
    env:
      CONFIG: pgc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check deployment changes
        id: check
        if: ${{ github.event_name == 'push' }}
        env:
          BASE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          npm run deploy:check -- pgc --base "$BASE"

      - run: npm run build
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_pgc == 'true' }}

      - name: Prepare bundle
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_pgc == 'true' }}
        env:
          DEPLOY_TOKEN: ${{ secrets.FTP_TOKEN }}
        run: |
          set -euo pipefail
          node tools/deployment/prepare.js --source tools/deployment/unzip.php --target dist/unzip.php
          (cd out && zip -qr ../dist/site.zip .)

      - name: Upload bundle
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_pgc == 'true' }}
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_PATH: public_html/${{ vars.FTP_HOST }}/archive
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail
          remote_path="${FTP_PATH%/}"

          if [ -n "$remote_path" ]; then
            base_url="ftp://${FTP_HOST}/${remote_path}"
          else
            base_url="ftp://${FTP_HOST}"
          fi

          curl --fail --show-error --silent --ftp-create-dirs --user "$FTP_USER:$FTP_PASS" -T dist/site.zip "${base_url}/site.zip"
          curl --fail --show-error --silent --ftp-create-dirs --user "$FTP_USER:$FTP_PASS" -T dist/unzip.php "${base_url}/unzip.php"

      - name: Unzip bundle
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_pgc == 'true' }}
        env:
          FTP_TOKEN: ${{ secrets.FTP_TOKEN }}
          FTP_HOST: ${{ vars.FTP_HOST }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(
            curl --show-error --silent --output "$response_file" --write-out "%{http_code}" --get "https://${FTP_HOST}/unzip.php" \
              --data-urlencode "token=${FTP_TOKEN}"
          )"
          cat "$response_file"
          test "$status" -ge 200 && test "$status" -lt 300

  deploy-pygc-prod:
    if: ${{ github.event_name == 'push' || inputs.event == 'pygc' }}
    runs-on: ubuntu-latest
    environment: pygc
    env:
      CONFIG: pygc
      SSH_PATH: '/usr/home/${{ secrets.SSH_USER }}/domains/${{ vars.SSH_HOST }}/public_nodejs/archive'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check deployment changes
        id: check
        if: ${{ github.event_name == 'push' }}
        env:
          BASE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          npm run deploy:check -- pygc --base "$BASE"

      - run: npm run build
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_pygc == 'true' }}

      - name: Deploy
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_pygc == 'true' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASS }}
          source: out/*
          strip_components: 1
          target: ${{ env.SSH_PATH }}

  deploy-honte-prod:
    if: ${{ github.event_name == 'push' || inputs.event == 'honte' }}
    runs-on: ubuntu-latest
    environment: honte
    env:
      CONFIG: honte
      SSH_PATH: '/usr/home/${{ secrets.SSH_USER }}/domains/${{ vars.SSH_HOST }}/public_nodejs'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check deployment changes
        id: check
        if: ${{ github.event_name == 'push' }}
        env:
          BASE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          npm run deploy:check -- honte --base "$BASE"
      - run: npm run build
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_honte == 'true' }}
      - name: Prepare
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_honte == 'true' }}
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
      - name: Clean up
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_honte == 'true' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASS }}
          script: |
            set -eu
            deploy_path='/usr/home/${{ secrets.SSH_USER }}/domains/${{ vars.SSH_HOST }}/public_nodejs'

            test -d "$deploy_path"
            rm -rf -- "$deploy_path/.next"
      - name: Deploy
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_honte == 'true' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASS }}
          source: .next/standalone/*
          strip_components: 2
          target: ${{ env.SSH_PATH }}
      - name: Restart
        if: ${{ github.event_name == 'workflow_dispatch' || steps.check.outputs.deploy_honte == 'true' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASS }}
          script: |
            cd /usr/home/${{ secrets.SSH_USER }}/domains/${{ vars.SSH_HOST }}/public_nodejs
            mv server.js app.js
            npm install sharp
            devil www restart ${{ vars.SSH_HOST }}
