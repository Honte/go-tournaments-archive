name: Deploy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      event:
        description: Event
        required: true
        type: choice
        default: pgc
        options:
          - pgc
          - pygc

jobs:
  deploy-pgc-prod:
    if: ${{ github.event_name == 'pull_request' || inputs.event == 'pgc' }}
    runs-on: ubuntu-latest
    environment: pgc
    env:
      EVENT: pgc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Prepare zip deploy bundle
        env:
          DEPLOY_TOKEN: ${{ secrets.FTP_TOKEN }}
        run: |
          set -euo pipefail
          node tools/deployment/prepare.js --source tools/deployment/unzip.php --target dist/unzip.php
          (cd out && zip -qr ../dist/site.zip .)

      - name: Upload zip deploy bundle
        env:
          FTP_HOST: ${{ vars.FTP_HOST }}
          FTP_PATH: public_html/${{ vars.FTP_HOST }}/2030
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail
          remote_path="${FTP_PATH%/}"

          if [ -n "$remote_path" ]; then
            base_url="ftp://${FTP_HOST}/${remote_path}"
          else
            base_url="ftp://${FTP_HOST}"
          fi

          curl --fail --show-error --silent --ftp-create-dirs --user "$FTP_USER:$FTP_PASS" -T dist/site.zip "${base_url}/site.zip"
          curl --fail --show-error --silent --ftp-create-dirs --user "$FTP_USER:$FTP_PASS" -T dist/unzip.php "${base_url}/unzip.php"

  #      - name: Trigger remote unzip
  #        env:
  #          FTP_TOKEN: ${{ secrets.FTP_TOKEN }}
  #          FTP_HOST: ${{ vars.FTP_HOST }}
  #        run: |
  #          set -euo pipefail
  #          response_file="$(mktemp)"
  #          status="$(
  #            curl --show-error --silent --output "$response_file" --write-out "%{http_code}" --get "https://${FTP_HOST}/unzip.php" \
  #              --data-urlencode "token=${FTP_TOKEN}"
  #          )"
  #          cat "$response_file"
  #          test "$status" -ge 200 && test "$status" -lt 300

  deploy-pygc-prod:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.event == 'pygc' }}
    runs-on: ubuntu-latest
    environment: pygc
    env:
      EVENT: pygc
      SSH_PATH: '/usr/home/${{ secrets.SSH_USER }}/domains/${{ vars.SSH_HOST }}/public_nodejs/archive'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_KEY_PASS }}
          source: out/*
          strip_components: 1
          target: ${{ env.SSH_PATH }}
